# Nginx gateway (HTTP)
# - Load-balances the Angular SPA at / across two instances (spa1/spa2)
# - Proxies /api/* -> TodoApi
# - Proxies /oem/* -> OemApi

upstream spa_cluster {
  # Default is round-robin; keep it explicit/simple for demonstration.
  server spa1:80 max_fails=3 fail_timeout=10s;
  server spa2:80 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

upstream todoapi_upstream {
  server todoapi:8080;
}

upstream oemapi_upstream {
  server oemapi:3000;
}

# Preserve the outermost scheme when running behind another reverse proxy.
# If X-Forwarded-Proto is not present, fall back to Nginx's $scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log main_ext;
  error_log  /var/log/nginx/error.log;

  # -------- Auth / OIDC (TodoApi) --------
  # Estes endpoints NÃO estão sob /api, por isso precisam de proxy explícito.
  location /authtest/ {
    proxy_pass http://todoapi_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Callback do OpenID Connect (Google) configurado em TodoApi: "/signin-oidc".
  location = /signin-oidc {
    proxy_pass http://todoapi_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # -------- Frontend (SPA) via LB --------
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # PROVA objetiva de load distribution
    add_header X-SPA-Upstream $upstream_addr always;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    proxy_pass http://spa_cluster;
  }

  # -------- TodoApi em /api/ --------
  location /api/ {
    proxy_pass http://todoapi_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # -------- OemApi em /oem/ --------
  # Externo: /oem/health -> Interno: /api/health
  location /oem/ {
    proxy_pass http://oemapi_upstream/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}
