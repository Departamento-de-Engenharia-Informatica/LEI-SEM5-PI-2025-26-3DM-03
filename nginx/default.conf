upstream todoapi_upstream {
    server todoapi:8080;
}

upstream oemapi_upstream {
    server oemapi:3000;
}

# Preserve the outermost scheme when running behind another reverse proxy.
# If X-Forwarded-Proto is not present, fall back to Nginx's $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;  # ou o hostname real / domínio

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # -------- Frontend (SPA) --------
    # Espera os ficheiros estáticos em /usr/share/nginx/html (bind-mount no docker-compose).
    root /usr/share/nginx/html;
    index index.html;

    # -------- Auth / OIDC (TodoApi) --------
    # Estes endpoints NÃO estão sob /api, por isso precisam de proxy explícito.
    # Caso contrário, caem no fallback da SPA e devolvem index.html.
    location /authtest/ {
        proxy_pass http://todoapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Callback do OpenID Connect (Google) configurado em TodoApi: options.CallbackPath = "/signin-oidc".
    location = /signin-oidc {
        proxy_pass http://todoapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback (Angular): qualquer rota não-estática vai para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------- TodoApi em /api/ --------
    # Externo: /api/WeatherForecast -> Interno: /WeatherForecast
    # (a API não usa prefixo /api, por isso removemos o prefixo ao encaminhar)
    location /api/ {
        proxy_pass http://todoapi_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # -------- OemApi em /oem/ --------
    # Externo: /oem/health -> Interno: /api/health
    # (a OemApi já tem prefixo global 'api')
    location /oem/ {
        proxy_pass http://oemapi_upstream/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
