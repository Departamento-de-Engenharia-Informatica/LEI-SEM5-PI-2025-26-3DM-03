upstream todoapi_upstream {
    server todoapi:8080;
}

upstream oemapi_upstream {
    server oemapi:3000;
}

server {
    listen 80;
    server_name _;  # ou o hostname real / domínio

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # -------- TodoApi em /api/ --------
    # Externo: /api/WeatherForecast -> Interno: /WeatherForecast
    # (a API não usa prefixo /api, por isso removemos o prefixo ao encaminhar)
    location /api/ {
        proxy_pass http://todoapi_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # -------- OemApi em /oem/ --------
    # Externo: /oem/health -> Interno: /api/health
    # (a OemApi já tem prefixo global 'api')
    location /oem/ {
        proxy_pass http://oemapi_upstream/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
