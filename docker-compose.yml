version: "3.9"

services:
  # Reverse proxy / gateway único (faz LB para a SPA e faz proxy para as APIs)
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    ports:
      - "80:80"        # entrada única HTTP
      # - "443:443"    # opcional se quiseres TLS mais tarde
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    # Em muitos ambientes académicos/legacy, "condition: service_healthy" pode não estar disponível.
    # Mantemos healthchecks nas APIs mas usamos um depends_on simples para compatibilidade.
    depends_on:
      - spa1
      - spa2
      - todoapi
      - oemapi
    networks:
      - app-net

  # ------------ SPA (Angular) - 2 instâncias para LB/failover ------------
  # Cada instância serve os mesmos ficheiros estáticos (dist) e o gateway distribui o tráfego.
  spa1:
    image: nginx:1.27-alpine
    container_name: spa1
    volumes:
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST_PATH:-/home/asist/spa-dist/browser}:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - app-net

  spa2:
    image: nginx:1.27-alpine
    container_name: spa2
    volumes:
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST_PATH:-/home/asist/spa-dist/browser}:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - app-net

  # ------------ TodoApi (.NET 8) ------------
  todoapi:
    build:
      context: .
      dockerfile: TodoApi/Dockerfile
    container_name: todoapi
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # SQLite em ficheiro dedicado, dentro do volume /data
      ConnectionStrings__DefaultConnection: "Data Source=/data/todoapi.db"
      # OIDC (Google) - por defeito desligado para arranques simples/CI.
      # Para ativar login real: exporta DISABLE_OIDC=false e define as credenciais.
      DisableOidc: "${DISABLE_OIDC:-true}"
      DISABLE_OIDC: "${DISABLE_OIDC:-true}"
      Authentication__Google__ClientId: "${Authentication__Google__ClientId:-}"
      Authentication__Google__ClientSecret: "${Authentication__Google__ClientSecret:-}"
      # A TodoApi fala com a OemApi internamente pela docker network
      Oem__BaseUrl: "http://oemapi:3000/api/"
    volumes:
      - todoapi-data:/data
    networks:
      - app-net
    healthcheck:
      # Usa um endpoint real existente; podes trocar depois para /api/health
      test: ["CMD-SHELL", "curl -f http://localhost:8080/WeatherForecast || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ------------ OemApi (NestJS) ------------
  oemapi:
    build:
      context: .
      dockerfile: oem-api/Dockerfile
    container_name: oemapi
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      # SQLite em ficheiro dedicado, dentro do volume /data
      DATABASE_PATH: "/data/oemapi.db"
    volumes:
      - oemapi-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app-net:
    driver: bridge

volumes:
  todoapi-data:
  oemapi-data:
